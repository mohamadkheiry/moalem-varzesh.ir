name: Android preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_STORE_URL: https://www.moalem-varzesh.ir
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and check app dependencies
        run: |
          npm ci
          npm run typecheck
          npm test > matrix.tap
          tail -8 matrix.tap
      - name: Generate the Android preview project
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.name = 'معلم ورزش آزمایشی';
          app.expo.android.package += '.preview';
          app.expo.scheme += 'preview';
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          JS
          npx --no-install expo prebuild --platform android --no-install
      - name: Prepare Android SDK packages
        run: |
          sdkmanager --install 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          if [[ ! -d "$ANDROID_HOME/platforms/android-37" ]]; then
            if [[ ! -d "$ANDROID_HOME/platforms/android-37.0" ]]; then
              sdkmanager --install 'platforms;android-37.0'
            fi
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build the standalone APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon --console=plain
      - name: Verify the APK
        run: |
          mkdir -p delivery
          apk=delivery/moalem-varzesh-android-1.0.0-preview.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep -F "name='ir.moalemvarzesh.store.preview'"
          unzip -l "$apk" assets/index.android.bundle | grep -F assets/index.android.bundle
          cd delivery
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: moalem-varzesh-android-preview
          path: mobile/delivery/
          if-no-files-found: error
          retention-days: 14
